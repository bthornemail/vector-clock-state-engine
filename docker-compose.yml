version: '3.8'

# Docker Compose configuration for Computational Scheme Theory
# Phase 1: Basic services for development and testing

services:
  # MCP Server - Model Context Protocol server for AI assistants
  mcp-server:
    build:
      context: .
      dockerfile: racket-mcp/Dockerfile
    container_name: cst-mcp-server
    stdin_open: true
    tty: true
    # MCP servers communicate via stdio, so we keep the container running
    # and attach to it for stdio communication
    command: ["racket", "racket-mcp/src/mcp-server.rkt"]
    volumes:
      # Optional: mount source for development
      - ./racket-unified:/app/racket-unified:ro
      - ./racket-mcp:/app/racket-mcp:ro
    # No ports needed - MCP uses stdio
    environment:
      - RACKET_VERSION=8.18
    # Keep container running
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo '{\"jsonrpc\":\"2.0\",\"method\":\"initialize\",\"params\":{},\"id\":1}' | racket /app/racket-mcp/src/mcp-server.rkt 2>&1 | grep -q protocolVersion"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL - Event store for Phase 2 (placeholder for Phase 1)
  postgres:
    image: postgres:15-alpine
    container_name: cst-postgres
    environment:
      POSTGRES_USER: cst_user
      POSTGRES_PASSWORD: cst_pass
      POSTGRES_DB: computational_scheme_theory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cst_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Phase 1: Not required, will be used in Phase 2
    profiles:
      - phase2

